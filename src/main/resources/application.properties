spring.application.name=erp

### Datasource Configuration ###
spring.datasource.url=jdbc:mysql://localhost:3306/erp?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

### Flowable Configuration ###
flowable.database-schema-update=true
flowable.async-executor-activate=true

# Disable unused Flowable engines
flowable.dmn.enabled=false
flowable.cmmn.enabled=false
flowable.form.enabled=false
flowable.content.enabled=false
flowable.eventregistry.enabled=false
flowable.idm.enabled=false