spring.application.name=erp

### Datasource Configuration ###
# nullCatalogMeansCurrent=true is required for Flowable + MySQL 8 driver:
# without it, metadata looks across all DBs and schema create becomes a failed "upgrade".
spring.datasource.url=jdbc:mysql://localhost:3306/erp?createDatabaseIfNotExist=true&nullCatalogMeansCurrent=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Surface specific validation messages (e.g. insufficient balance, overlapping leave) to API clients.
server.error.include-message=always

### Flowable Configuration ###
flowable.database-schema-update=true
flowable.database-catalog=erp
flowable.async-executor-activate=true

# Disable unused Flowable engines
flowable.dmn.enabled=false
flowable.cmmn.enabled=false
flowable.form.enabled=false
flowable.content.enabled=false
flowable.eventregistry.enabled=false
flowable.idm.enabled=false