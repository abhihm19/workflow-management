<div class="sidenav-root" [class.collapsed]="collapsed">
  <nav class="sidenav-nav">
    <div class="nav-group" *ngFor="let group of groups">
      <button
        type="button"
        class="nav-group-header"
        [class.active]="isGroupActive(group)"
        [matTooltip]="collapsed ? group.label : ''"
        matTooltipPosition="right"
        (click)="onGroupClick(group)"
      >
        <mat-icon>{{ group.icon }}</mat-icon>
        <span class="nav-label" *ngIf="!collapsed">{{ group.label }}</span>
        <mat-icon class="expand-icon" *ngIf="!collapsed">
          {{ isExpanded(group) ? 'expand_less' : 'expand_more' }}
        </mat-icon>
      </button>

      <div class="nav-children" *ngIf="!collapsed && isExpanded(group)">
        <a
          *ngFor="let item of group.children"
          [routerLink]="item.route"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
          class="nav-child"
        >
          <mat-icon>{{ item.icon }}</mat-icon>
          <span>{{ item.label }}</span>
        </a>
      </div>
    </div>
  </nav>
</div>
